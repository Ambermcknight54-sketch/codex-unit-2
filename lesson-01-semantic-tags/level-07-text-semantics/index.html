<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Images starter</title>
  </head>
  <body>
    <h1>Gallery</h1>

    <!-- Informative image with descriptive alt text -->
    <img
      src="images/example.jpg"
      alt="Children playing soccer outdoors on a grassy field, actively engaged in an energetic game with a cheerful atmosphere" />

    <!-- Semantic grouping for an image that requires a visible caption -->
    <figure>
      <img
        src="images/project-preview.jpg"
        alt="Browser window displaying a completed responsive landing page with navigation menu, hero section, and content areas in a clean, modern design layout" />
      <figcaption>
        Figure 1: The completed responsive landing page layout.
      </figcaption>
    </figure>
  </body>
</html>
