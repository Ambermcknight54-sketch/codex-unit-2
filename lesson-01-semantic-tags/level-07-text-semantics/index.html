<!-- Level 7 starter: Inline code and preformatted text -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code semantics starter</title>
  </head>
  <body>
    <h1>Examples</h1>
    <details>
      <!-- The visible label that a user clicks to expand the widget -->
      <summary>View additional explanation</summary>
      <!-- The hidden content revealed upon activation -->
      <p>Hidden explanation goes here.</p>
    </details>
  </body>
</html>
