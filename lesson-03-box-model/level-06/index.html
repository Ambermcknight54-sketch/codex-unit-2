<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Level 06 — Combining Layout Rules</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Two-column layout</h1>

      <div class="col left">
        <h2>Left Column</h2>
        <p>
          This side holds primary structural details or main navigation nodes.
        </p>
      </div>

      <div class="col right">
        <h2>Right Column</h2>
        <p>
          This side tracks complementary information or supplementary
          documentation files.
        </p>
      </div>
    </main>
  </body>
</html>
