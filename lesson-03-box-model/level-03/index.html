      <h1>Padding / Border / Margin Deep Dive</h1>

      <div class="demo" id="demo-box">Demo box</div>

      <p class="observation">
        <strong>Observation:</strong> Increasing the padding expanded the
        background color and grew the space inside the border, while increasing
        the margin pushed the text paragraph further down away from the box
        without changing the size of the box itself.
      </p>
