<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Level 14 — Mini-project</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <form id="sample-form">
      <input name="name" type="text" placeholder="Your Name" required /><br />

      <textarea name="message" placeholder="Your Message"></textarea><br />

      <label>Volume: <input name="volume" type="range" /></label><br />

      <fieldset>
        <legend>Theme Color:</legend>
        <label><input type="radio" name="color" value="Light" /> Light</label>
        <label><input type="radio" name="color" value="Dark" /> Dark</label>
      </fieldset>

      <label><input type="checkbox" name="subscribe" /> Get updates</label
      ><br />

      <button type="submit">Send Data</button>
    </form>
  </body>
</html>
