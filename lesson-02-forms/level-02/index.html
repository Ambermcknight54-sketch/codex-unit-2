<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 02</title>
  </head>
  <body>
    <h1>Level 02 — Name & Email Inputs</h1>

    <div class="work-area">
      <h2>Begin completing Unit 2</h2>
      <p>Learning how to use VS Code.</p>

      <form>
        <div>
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            placeholder="John Doe"
            required />
        </div>

        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="john.doe@example.com"
            required />
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
