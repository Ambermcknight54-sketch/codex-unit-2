<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 02</title>
  </head>
  <body>
    <h1>Level 02 — Name & Email Inputs</h1>

    <div class="work-area">
      <h2>Begin completing Unit 2</h2>
      <p>Learning how to use VS Code.</p>

      <form>
      <!-- Nested layout avoids needing separate ID and FOR attributes -->
      <label>
        Name
        <input type="text" name="name" autocomplete="name" required />
      </label>

      <label>
        Email
        <input type="email" name="email" autocomplete="email" required />
      </label>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
